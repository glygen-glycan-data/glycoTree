<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Residue Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://glymage.glyomics.org/js/glymagesvg.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            width: 20px; height: 20px; border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 drop-shadow-sm mb-2" id="header-title">Glycan Image Viewer</h1>
        </header>

        <!-- Dynamic Status / Loader -->
        <div id="status" class="mb-6 flex justify-center text-center"></div>

        <!-- Main Content Area -->
        <div id="main-content" class="space-y-12">
            <!-- Sections injected via JS -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Get the canonical residue ID(s) from the URL parameters
            const params = new URLSearchParams(window.location.search);

            // Try common parameters, or fall back to picking the first available value in the query string
            let rawCanonicalId = params.get('canonical_id') || params.get('residue_id') || params.get('id');
            if (!rawCanonicalId) {
                for (const key of params) {
                    rawCanonicalId = key[0];
                    break;
                }
            }

            const statusEl = document.getElementById('status');
            const mainContent = document.getElementById('main-content');
            const headerTitle = document.getElementById('header-title');

            if (!rawCanonicalId) {
                statusEl.innerHTML = `
                    <div class="bg-white border-l-4 border-indigo-500 text-indigo-900 p-5 rounded-md shadow-sm text-left max-w-xl mx-auto">
                        <p class="font-bold mb-1 text-lg">Residue ID Required</p>
                        <p class="text-sm text-gray-600 mb-3">Please provide a canonical residue ID in the URL to begin.</p>
                        <p class="text-sm font-mono bg-indigo-50 text-indigo-700 inline-block px-3 py-1.5 rounded border border-indigo-100">
                            Example: ?canonical_id=G12345,G67890
                        </p>
                    </div>`;
                return;
            }

            // Split and clean the comma-separated IDs
            const canonicalIds = rawCanonicalId.split(',').map(s => s.trim()).filter(s => s.length > 0);
            const isSingle = canonicalIds.length === 1;
            
            // If single ID, behave as before (up to 9 items in 3x3 grid)
            // If multiple IDs, use up to 3 items per row to fit each nicely in a 3-column layout
            const maxItemsPerId = isSingle ? 9 : 3;

            if (isSingle) {
                headerTitle.innerHTML = `Glycans for Canonical ID: <span class="text-indigo-600">${canonicalIds[0]}</span>`;
            } else {
                headerTitle.innerHTML = `Glycans for Multiple Canonical IDs`;
            }
            
            // Show initial loading state
            statusEl.innerHTML = `
                <div class="flex items-center space-x-3 text-indigo-700 font-medium bg-indigo-50 px-5 py-2.5 rounded-full shadow-sm border border-indigo-100">
                    <div class="spinner border-indigo-600"></div>
                    <span>Fetching accessions from sandbox...</span>
                </div>
            `;

            for (let i = 0; i < canonicalIds.length; i++) {
                const canonicalId = canonicalIds[i];

                // Create a section container for the specific ID
                const section = document.createElement('section');
                section.innerHTML = `
                    ${!isSingle ? `<h2 class="text-2xl font-bold text-gray-800 border-b border-gray-200 pb-2 mb-6">Canonical ID: <span class="text-indigo-600">${canonicalId}</span></h2>` : ''}
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="grid-${i}"></div>
                `;
                mainContent.appendChild(section);

                const container = section.querySelector(`#grid-${i}`);

                try {
                    // 2. Request GlyTouCan accessions from sandbox.glyomics.org (list.php)
                    let listApiUrl = 'api/list.php';
                    listApiUrl += `?mode=res&par=${canonicalId}`;

                    const listResponse = await fetch(listApiUrl);
                    
                    if (!listResponse.ok) throw new Error(`Failed to fetch accessions (Status: ${listResponse.status})`);

                    const listText = await listResponse.text();
                    let accessions = [];
                    
                    // Robust parsing: works if API returns JSON Array, JSON Object, or Newline separated text
                    try {
                        const listData = JSON.parse(listText);
                        if (Array.isArray(listData)) {
                            accessions = listData.map(item => typeof item === 'object' ? (item.accession || item.glytoucan_ac || item.id) : item);
                        } else if (listData && Array.isArray(listData.accessions)) {
                            accessions = listData.accessions;
                        } else if (listData && typeof listData === 'object') {
                            accessions = Object.values(listData).filter(val => typeof val === 'string');
                        }
                    } catch (e) {
                        accessions = listText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    }

                    // Filter out invalid items
                    accessions = accessions.filter(a => typeof a === 'string' && a.length >= 4);

                    // 3. Select items based on the single/multiple layout preference
                    const selectedAccessions = accessions.slice(0, maxItemsPerId);

                    if (selectedAccessions.length === 0) {
                        container.innerHTML = `
                            <div class="col-span-full bg-yellow-50 border-l-4 border-yellow-500 text-yellow-800 p-4 rounded-md shadow-sm text-left">
                                <p class="font-bold">No accessions found</p>
                                <p class="text-sm mt-1">Could not find any related glytoucan accessions for Canonical ID <strong>${canonicalId}</strong>.</p>
                            </div>`;
                        continue;
                    }

                    // 4. Request Glycan details & 5. Make a grid via Glymage
                    for (const acc of selectedAccessions) {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-200 overflow-hidden flex flex-col items-center p-5 relative";
                        
                        // Loading skeleton for individual card
                        card.innerHTML = `
                            <div class="w-full flex justify-between items-center mb-4">
                                <h3 class="font-bold text-gray-800 text-lg">${acc}</h3>
                            </div>
                            <div class="flex-grow flex flex-col items-center justify-center w-full min-h-[180px] bg-gray-50 rounded-lg">
                                <div class="spinner border-gray-400 mb-3"></div>
                                <p class="text-xs text-gray-500 font-medium animate-pulse">Loading glycan details...</p>
                            </div>
                        `;
                        container.appendChild(card);

                        // Fetch details (glycan-v5.php) and update card asynchronously
                        fetch(`api/glycan-v5.php/${acc}`)
                            .then(res => res.ok ? res.json() : null)
                            .then(details => {
                                
                                let glymage_canonical_id = null;
                                if (details && details.residues) {
                                    for (const res of details.residues) {
                                        if (res.residue_id == canonicalId) {
                                            glymage_canonical_id = res.canonical_residue_index;
                                        }
                                    }
                                }

                                card.innerHTML = `
                                    <div class="w-full flex justify-between items-start mb-3">
                                        <h3 class="font-bold text-gray-900 text-xl tracking-tight">${acc}</h3>
                                    </div>
                                    <div class="flex-grow w-full flex items-center justify-center bg-white p-2 min-h-[180px]">
                                        <figure glymagesvg_accession="${acc}" 
                                            glymagesvg_width="300px" glymagesvg_height="200px"
                                            glymagesvg_annotation="CanonicalResidueIDs.${glymage_canonical_id}"
                                            glymagesvg_imageclass="glymagesvg_hover_low_opacity"
                                            glymagesvg_monoclass="glymagesvg_hover_high_opacity"
                                            glymagesvg_highlight_parent_link="true"
                                            glymagesvg_linkclass="glymagesvg_hover_high_opacity"
                                            glymagesvg_linkinfoclass="glymagesvg_hover_high_opacity"
                                            class="max-w-full max-h-48 object-contain transition-transform duration-300" >
                                        </figure>
                                    </div>
                                    <div class="w-full mt-4 flex justify-between items-center border-t border-gray-100 pt-4">
                                        <a href="explore.html?focus=${acc}" target="_blank" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 inline-flex items-center gap-1.5 transition-colors">
                                            View in Sandbox
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                            </svg>
                                        </a>
                                    </div>
                                `;
                                if (typeof glymagesvg !== 'undefined') glymagesvg.init();
                            })
                            .catch(err => {
                                console.error(`Failed to fetch details for ${acc}:`, err);
                                const imgUrl = `https://glymage.glyomics.org/image/snfg/extended/${acc}?highlight=${canonicalId}`;
                                
                                // Fallback rendering in case glycan-v5 fails, still attempts to load the image
                                card.innerHTML = `
                                    <div class="w-full flex justify-between items-start mb-3">
                                        <h3 class="font-bold text-gray-900 text-xl tracking-tight">${acc}</h3>
                                    </div>
                                    <div class="flex-grow w-full flex items-center justify-center bg-white p-2 min-h-[180px]">
                                        <img src="${imgUrl}" alt="${acc} Image" 
                                            class="max-w-full max-h-48 object-contain" 
                                            onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-sm text-red-600 bg-red-50 py-1.5 px-3 rounded-md border border-red-100 font-medium\\'>Image Unavailable</div>'" />
                                    </div>
                                    <div class="w-full mt-4 flex justify-between items-center border-t border-gray-100 pt-4">
                                        <p class="text-xs text-red-400 font-medium">Details unavailable</p>
                                        <a href="https://glytoucan.org/Structures/Glycans/${acc}" target="_blank" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                                            View Data
                                        </a>
                                    </div>
                                `;
                            });
                    }
                } catch (error) {
                    console.error(error);
                    container.innerHTML = `
                        <div class="col-span-full bg-red-50 border-l-4 border-red-500 text-red-800 p-5 rounded-md shadow-sm text-left">
                            <p class="font-bold text-lg mb-1">Communication Error</p>
                            <p class="text-sm">${error.message}</p>
                            <p class="text-xs mt-3 text-gray-500 bg-white p-2 rounded border border-gray-100">Ensure this page has valid CORS permissions to contact sandbox.glyomics.org.</p>
                        </div>`;
                }
            }

            // Hide the green "success" banner after 3 seconds
            statusEl.innerHTML = `
                <div class="flex items-center space-x-2 text-emerald-700 font-medium bg-emerald-50 border border-emerald-100 px-5 py-2.5 rounded-full shadow-sm">
                    <span>Successfully processed ${canonicalIds.length} canonical ID(s).</span>
                </div>
            `;
            setTimeout(() => statusEl.innerHTML = '', 3000);
        });
    </script>
</body>
</html>
